name: CI

"on":
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (no torch yet — CPU wheel installed separately below)
        run: pip install -e ".[dev]"

      - name: Install CPU-only torch
        run: pip install torch==2.13.0 torchvision==0.28.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Run the check gate
        run: ./scripts/check.sh
