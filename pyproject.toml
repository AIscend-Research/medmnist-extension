[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cartomnist"
version = "0.1.0"
description = "Cartographic generalization for low-resolution medical imaging benchmarks"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-image>=0.21",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "pillow>=9.5",
  "joblib>=1.3",
]

[project.optional-dependencies]
torch = ["torch>=2.0", "torchvision>=0.15"]
data = ["medmnist>=3.0"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["cartomnist*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
